# Production stack: migrate against Supabase, then the app and scheduler.
# DATABASE_URL must point at your Supabase project (see .env.example).
services:
  migrate:
    build:
      context: .
      target: worker
    command: ["npm", "run", "db:migrate"]
    env_file: .env
    environment:
      SKIP_ENV_VALIDATION: "0"

  app:
    build:
      context: .
      target: runner
    env_file: .env
    environment:
      SKIP_ENV_VALIDATION: "0"
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "80:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    build:
      context: .
      target: worker
    env_file: .env
    environment:
      SKIP_ENV_VALIDATION: "0"
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 120s
    restart: unless-stopped

volumes:
  uploads:
